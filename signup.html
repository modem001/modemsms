<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050817">
<title>Modem Technologies — Authentication</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#040714;
    --card:#0b1024;
    --card2:#0e1530;
    --border:rgba(145,155,255,.15);
    --text:#f7f8ff;
    --muted:#8f97b7;
    --primary:#5d63ff;
    --primary2:#8b5cff;
    --input:#090e20;
}

html,body{
    width:100%;
    min-height:100%;
    background:
        radial-gradient(circle at 50% -10%,rgba(91,99,255,.23),transparent 38%),
        linear-gradient(180deg,#050817 0%,#02040d 100%);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:430px;
    min-height:100vh;
    padding:24px 18px 30px;
    position:relative;
}

.glow{
    position:absolute;
    width:210px;
    height:210px;
    border-radius:50%;
    background:rgba(93,99,255,.13);
    filter:blur(70px);
    top:-70px;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
}

.header{
    position:relative;
    text-align:center;
    padding:8px 0 26px;
}

.logo{
    font-family:"Plus Jakarta Sans",sans-serif;
    font-size:25px;
    font-weight:800;
    letter-spacing:-1.1px;
}

.logo span{
    background:linear-gradient(135deg,#8d93ff,#a76cff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.logo-sub{
    margin-top:5px;
    color:#737b9e;
    font-size:10px;
    letter-spacing:2.6px;
    text-transform:uppercase;
}

.intro{
    text-align:center;
    padding:4px 8px 21px;
}

.intro h1{
    font-family:"Plus Jakarta Sans",sans-serif;
    font-size:27px;
    line-height:1.15;
    letter-spacing:-.8px;
    margin-bottom:8px;
}

.intro p{
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
}

.auth-card{
    position:relative;
    background:linear-gradient(180deg,rgba(15,22,49,.96),rgba(7,11,27,.98));
    border:1px solid var(--border);
    border-radius:25px;
    padding:18px 16px 17px;
    box-shadow:0 25px 70px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.025);
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    padding:4px;
    background:#060a18;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    margin-bottom:19px;
}

.tab{
    border:0;
    background:transparent;
    color:#777f9f;
    padding:11px 8px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.tab.active{
    color:#fff;
    background:linear-gradient(135deg,#343bd0,#5d50d9);
    box-shadow:0 7px 20px rgba(72,75,220,.22);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:#c7cce2;
    font-size:11px;
    font-weight:600;
    margin:0 0 7px 3px;
}

.input-wrap{
    position:relative;
}

.input-wrap input{
    width:100%;
    height:48px;
    border-radius:13px;
    border:1px solid rgba(135,145,210,.13);
    background:var(--input);
    color:#fff;
    outline:none;
    padding:0 14px;
    font-size:13px;
    transition:.2s;
}

.input-wrap input:focus{
    border-color:rgba(103,110,255,.72);
    box-shadow:0 0 0 3px rgba(93,99,255,.09);
}

.password-toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#7f87aa;
    cursor:pointer;
    font-size:11px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:2px 2px 15px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#858daa;
    font-size:10px;
}

.remember input{
    accent-color:#646aff;
}

.link{
    color:#8189ff;
    border:0;
    background:none;
    font-size:10px;
    cursor:pointer;
}

.primary{
    width:100%;
    height:49px;
    border:0;
    border-radius:14px;
    color:#fff;
    background:linear-gradient(135deg,#4049df,#7452ee);
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 12px 27px rgba(81,76,220,.22);
    transition:.2s;
}

.primary:active{
    transform:scale(.985);
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:#626a89;
    font-size:10px;
    margin:18px 0 13px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,.07);
}

.socials{
    display:grid;
    gap:9px;
}

.social{
    width:100%;
    height:45px;
    border-radius:13px;
    border:1px solid rgba(142,151,210,.13);
    background:#080d1d;
    color:#e9ebf6;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.social:active{
    background:#0d1329;
}

.social-icon{
    width:18px;
    height:18px;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:13px;
}

.google{
    color:#fff;
}

.github{
    color:#fff;
}

.bottom-switch{
    text-align:center;
    color:#747c9c;
    font-size:11px;
    margin-top:17px;
}

.bottom-switch button{
    border:0;
    background:none;
    color:#8d92ff;
    font-weight:700;
    cursor:pointer;
}

.status{
    min-height:17px;
    margin:9px 3px 0;
    text-align:center;
    color:#8f97b7;
    font-size:10px;
}

.status.error{
    color:#ff7e91;
}

.status.success{
    color:#72e0b0;
}

.footer{
    text-align:center;
    color:#4f5774;
    font-size:9px;
    line-height:1.6;
    padding:20px 8px 0;
}

.footer a{
    color:#70799d;
    text-decoration:none;
}

@media (min-width:700px){
    body{
        align-items:center;
        padding:25px 0;
    }

    .page{
        min-height:0;
        border:1px solid rgba(255,255,255,.07);
        border-radius:30px;
        box-shadow:0 30px 90px rgba(0,0,0,.5);
        overflow:hidden;
    }
}
</style>
</head>

<body>
<main class="page">
    <div class="glow"></div>

    <header class="header">
        <div class="logo">Modem <span>Technologies</span></div>
        <div class="logo-sub">Developer Infrastructure</div>
    </header>

    <section class="intro">
        <h1 id="title">Welcome Back</h1>
        <p id="subtitle">Sign in to manage your applications, SMS and OTP services.</p>
    </section>

    <section class="auth-card">
        <div class="tabs">
            <button class="tab active" id="loginTab" type="button">Login</button>
            <button class="tab" id="signupTab" type="button">Sign Up</button>
        </div>

        <!-- LOGIN -->
        <form class="form active" id="loginForm">
            <div class="field">
                <label for="loginEmail">Email</label>
                <div class="input-wrap">
                    <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                    <button class="password-toggle" type="button" onclick="togglePassword('loginPassword',this)">Show</button>
                </div>
            </div>

            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <button class="link" type="button" onclick="forgotPassword()">Forgot password?</button>
            </div>

            <button class="primary" type="submit">Login</button>

            <div class="divider">OR CONTINUE WITH</div>

            <div class="socials">
                <button class="social google" type="button" onclick="socialLogin('Google')">
                    <span class="social-icon">G</span>
                    Continue with Google
                </button>

                <button class="social github" type="button" onclick="socialLogin('GitHub')">
                    <span class="social-icon">◆</span>
                    Continue with GitHub
                </button>
            </div>

            <div class="status" id="loginStatus"></div>

            <div class="bottom-switch">
                Don't have an account?
                <button type="button" onclick="showSignup()">Sign Up</button>
            </div>
        </form>

        <!-- SIGN UP -->
        <form class="form" id="signupForm">
            <div class="field">
                <label for="signupName">Full Name</label>
                <div class="input-wrap">
                    <input id="signupName" type="text" autocomplete="name" placeholder="Your full name" required>
                </div>
            </div>

            <div class="field">
                <label for="signupEmail">Email</label>
                <div class="input-wrap">
                    <input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="field">
                <label for="signupPassword">Password</label>
                <div class="input-wrap">
                    <input id="signupPassword" type="password" autocomplete="new-password" placeholder="Create a password" minlength="6" required>
                    <button class="password-toggle" type="button" onclick="togglePassword('signupPassword',this)">Show</button>
                </div>
            </div>

            <div class="field">
                <label for="signupConfirm">Confirm Password</label>
                <div class="input-wrap">
                    <input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat your password" minlength="6" required>
                    <button class="password-toggle" type="button" onclick="togglePassword('signupConfirm',this)">Show</button>
                </div>
            </div>

            <button class="primary" type="submit">Create Account</button>

            <div class="divider">OR CONTINUE WITH</div>

            <div class="socials">
                <button class="social google" type="button" onclick="socialLogin('Google')">
                    <span class="social-icon">G</span>
                    Continue with Google
                </button>

                <button class="social github" type="button" onclick="socialLogin('GitHub')">
                    <span class="social-icon">◆</span>
                    Continue with GitHub
                </button>
            </div>

            <div class="status" id="signupStatus"></div>

            <div class="bottom-switch">
                Already have an account?
                <button type="button" onclick="showLogin()">Login</button>
            </div>
        </form>
    </section>

    <footer class="footer">
        By continuing, you agree to Modem Technologies'
        <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>.
    </footer>
</main>

<script>
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");

function showLogin(){
    loginTab.classList.add("active");
    signupTab.classList.remove("active");
    loginForm.classList.add("active");
    signupForm.classList.remove("active");

    title.textContent = "Welcome Back";
    subtitle.textContent = "Sign in to manage your applications, SMS and OTP services.";
    window.scrollTo({top:0,behavior:"smooth"});
}

function showSignup(){
    signupTab.classList.add("active");
    loginTab.classList.remove("active");
    signupForm.classList.add("active");
    loginForm.classList.remove("active");

    title.textContent = "Create Account";
    subtitle.textContent = "Create your Modem account and start building with our infrastructure.";
    window.scrollTo({top:0,behavior:"smooth"});
}

loginTab.addEventListener("click",showLogin);
signupTab.addEventListener("click",showSignup);

function togglePassword(id,button){
    const input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        button.textContent = "Hide";
    }else{
        input.type = "password";
        button.textContent = "Show";
    }
}

function setStatus(id,message,type=""){
    const el = document.getElementById(id);
    el.textContent = message;
    el.className = "status " + type;
}

loginForm.addEventListener("submit",function(e){
    e.preventDefault();
    setStatus("loginStatus","Login connection will be connected to Supabase.","");
});

signupForm.addEventListener("submit",function(e){
    e.preventDefault();

    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("signupConfirm").value;

    if(password !== confirm){
        setStatus("signupStatus","Passwords do not match.","error");
        return;
    }

    setStatus("signupStatus","Sign up connection will be connected to Supabase.","");
});

function socialLogin(provider){
    const message = provider + " authentication will be connected to Supabase.";
    const activeStatus = signupForm.classList.contains("active") ? "signupStatus" : "loginStatus";
    setStatus(activeStatus,message,"");
}

function forgotPassword(){
    setStatus("loginStatus","Enter your email and password recovery will be available here.","");
}
</script>

</body>
</html>
