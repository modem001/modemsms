<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modem — OTP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#020511;color:#fff;font-family:Inter;display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100vh;padding-bottom:82px}header{padding:15px 16px;background:#030713;border-bottom:1px solid #ffffff0b;display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2864ff,#8b3cff);display:grid;place-items:center;font-weight:800;font-size:22px;font-style:italic}header b{font-size:15px}header small{display:block;color:#7e89ad;font-size:9px}main{padding:16px}h1{font-size:23px;margin:6px 0}.muted{font-size:11px;color:#8e98ba;line-height:1.6}.card{background:#08112d;border:1px solid #1b2a5c;border-radius:18px;padding:15px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0a;font-size:11px}.row:last-child{border:0}input,textarea,select{width:100%;background:#030817;border:1px solid #1d2b5b;color:#fff;border-radius:11px;padding:12px;margin:6px 0 11px}label{font-size:10px;color:#aab3d0;font-weight:700}button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#315dff,#783dff);color:#fff;font-weight:800;margin-top:8px}pre{white-space:pre-wrap;background:#030817;border:1px solid #ffffff0c;border-radius:12px;padding:12px;font:9px/1.6 monospace;color:#c7cff0}.nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#030713f5;border-top:1px solid #ffffff0b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.nav a{text-decoration:none;color:#737eaa;text-align:center;font-size:8px;font-weight:700;padding:6px 2px}.nav i{font-style:normal;font-size:17px;display:block;margin-bottom:4px}.nav .on{color:#a083ff}</style></head><body><div class="app"><header><div class="logo">M</div><div><b>Modem Technologies</b><small>OTP</small></div></header><main><h1>OTP</h1><p class="muted">Configure OTP behaviour. User phone numbers come automatically from the connected application.</p><section class="card"><p class="muted">Production flow: the connected app sends its user phone automatically. This page is configuration/testing, not the user signup form.</p><label>APPLICATION</label><select id="app"></select><label>OTP LENGTH</label><select id="len"><option>6</option><option>4</option><option>8</option></select><label>EXPIRY</label><select id="exp"><option>5</option><option>2</option><option>10</option></select><button onclick="save()">Save OTP Configuration</button><p id="msg" class="muted"></p></section><script>async function load(){const u=await requireUser();if(!u)return;const {data}=await modem.from("applications").select("id,name").eq("user_id",u.id);app.innerHTML=(data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}async function save(){const u=await requireUser();if(!u)return;msg.textContent="Configuration ready. Real OTP generation/SMS delivery will run through the backend Edge Function."; }load();</script></main><nav class="nav"><a class="" href="dashboard.html"><i>⌂</i>Dashboard</a><a class="" href="applications.html"><i>▦</i>Apps</a><a class="" href="api.html"><i>&lt;/&gt;</i>API</a><a class="" href="sms.html"><i>▣</i>SMS</a><a class="" href="settings.html"><i>⚙</i>Settings</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></div></body></html>
