<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modem — Applications</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020511;color:#fff;font-family:Inter,Arial;display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100vh;padding-bottom:82px}.head{padding:16px;background:#030713;border-bottom:1px solid #ffffff0b;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:9px;align-items:center}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2864ff,#8b3cff);display:grid;place-items:center;font-weight:800;font-size:22px;font-style:italic}.brand b{font-size:15px}.brand small{display:block;color:#7e89ad;font-size:9px}.main{padding:16px}.card{background:#08112d;border:1px solid #1b2a5c;border-radius:18px;padding:15px;margin-bottom:12px}h1{font-size:23px;margin:5px 0}.muted{color:#8e98ba;font-size:11px;line-height:1.55}.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff0a}.row:last-child{border:0}.ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7040ff,#3161ff);display:grid;place-items:center;font-weight:800}.grow{flex:1}.grow b{font-size:12px}.grow small{display:block;color:#7e89aa;font-size:9px;margin-top:4px}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#315dff,#783dff);color:#fff;font-weight:800;margin-top:10px}input,select,textarea{width:100%;background:#030817;border:1px solid #1d2b5b;color:#fff;border-radius:11px;padding:12px;margin:6px 0 10px}label{font-size:10px;color:#aab3d0;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:end;justify-content:center}.modal>div{width:100%;max-width:430px;background:#07102b;border:1px solid #243467;border-radius:22px 22px 0 0;padding:20px}.nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#030713f5;border-top:1px solid #ffffff0b;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.nav a{text-decoration:none;color:#737eaa;text-align:center;font-size:8px;font-weight:700;padding:6px 2px}.nav i{font-style:normal;font-size:17px;display:block;margin-bottom:4px}.nav .on{color:#a083ff}
</style><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"></head><body><div class="app"><header class="head"><div class="brand"><div class="logo">M</div><div><b>Modem Technologies</b><small>Applications</small></div></div></header><main class="main"><h1>Applications</h1><p class="muted">Connect apps such as StudentX or iChat. Each app can have its own sender name and API credentials.</p><button class="btn" onclick="openModal()">+ Add Application</button><section class="card" id="list" style="margin-top:12px">Loading...</section></main><nav class="nav"><a href="dashboard.html"><i>⌂</i>Dashboard</a><a class="on" href="applications.html"><i>▦</i>Apps</a><a href="api.html"><i>&lt;/&gt;</i>API</a><a href="sms.html"><i>▣</i>SMS</a><a href="settings.html"><i>⚙</i>Settings</a></nav>
<div class="modal" id="modal"><div><h2>Add Application</h2><label>Application name</label><input id="n" placeholder="StudentX"><label>Description</label><input id="d" placeholder="Student platform"><label>Sender name</label><input id="s" placeholder="StudentX" maxlength="11"><label>Services</label><select id="v"><option value="sms,otp">SMS + OTP</option><option value="sms">SMS only</option><option value="otp">OTP only</option></select><button class="btn" onclick="add()">Create Application</button><button class="btn" style="background:#101a3b" onclick="closeModal()">Cancel</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const list=document.getElementById('list');function openModal(){document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
async function load(){const u=await requireUser();if(!u)return;const {data}=await modem.from('applications').select('*').eq('user_id',u.id).order('created_at',{ascending:false});list.innerHTML=data?.length?data.map(a=>`<div class="row"><div class="ico">${esc(a.name[0])}</div><div class="grow"><b>${esc(a.name)}</b><small>${esc(a.sender_name)} • ${(a.services||[]).join(' + ').toUpperCase()} • ${esc(a.status)}</small></div></div>`).join(''):'<p class="muted">No applications yet.</p>'}
async function add(){const u=await requireUser();if(!u)return;const {error}=await modem.from('applications').insert({user_id:u.id,name:n.value.trim(),description:d.value.trim(),sender_name:s.value.trim(),services:v.value.split(',')});if(error)return alert(error.message);closeModal();load()}load();
</script></div></body></html>
